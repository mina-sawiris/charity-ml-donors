<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CharityML Predictor</title>
    
    <!-- Bootstrap CSS - This makes our UI look modern and clean -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
    <!-- White card with a light shadow for a professional look -->
    <div class="card shadow p-4" style="max-width: 600px; margin: auto;">
        
        <!-- Form title and a short description -->
        <h2 class="text-center mb-4">CharityML Prediction Form</h2>
        <p class="text-center text-muted">Please enter the applicant's details below.</p>

        <!-- The form container that sends data to the Flask backend -->
        <form action="/predict" method="POST">
            
            <!-- 1. Age Input Field -->
            <div class="mb-3">
                <label for="ageInput" class="form-label">Age</label>
                <!-- min="17" and max="100" based on census data. step="1" prevents decimals -->
                <input type="number" class="form-control" id="ageInput" name="age" min="17" max="100" step="1" placeholder="e.g., 35" required>
                <!-- Small text to help the user -->
                <div class="form-text">Must be between 17 and 100 years.</div>
            </div>

            <!-- 2. Education Years Input Field -->
            <div class="mb-3">
                <label for="eduInput" class="form-label">Highest Education Level</label>
                <select class="form-select" id="eduInput" name="education_num" required>
                    <!-- Options are mapped exactly to the dataset's education-num values -->
                    <option value="1">Preschool</option>
                    <option value="2">1st-4th</option>
                    <option value="3">5th-6th</option>
                    <option value="4">7th-8th</option>
                    <option value="5">9th</option>
                    <option value="6">10th</option>
                    <option value="7">11th</option>
                    <option value="8">12th</option>
                    <option value="9">HS-grad (High School)</option>
                    <option value="10">Some-college</option>
                    <option value="11">Assoc-voc (Vocational)</option>
                    <option value="12">Assoc-acdm (Academic)</option>
                    <option value="13" selected>Bachelors</option>
                    <option value="14">Masters</option>
                    <option value="15">Prof-school</option>
                    <option value="16">Doctorate</option>
                </select>
            </div>

            <!-- 3. Capital Gain Input Field (Assuming it is placed after Education) -->
            <div class="mb-3">
                <label for="capGainInput" class="form-label">Capital Gain ($)</label>
                <!-- min="0" prevents negative gains. max="99999" is the dataset limit -->
                <input type="number" class="form-control" id="capGainInput" name="capital_gain" value="0" min="0" max="99999" step="1" required>
            </div>

            <!-- 4. Capital Loss Input Field -->
            <div class="mb-3">
                <label for="capLossInput" class="form-label">Capital Loss ($)</label>
                <!-- min="0" prevents negative losses -->
                <input type="number" class="form-control" id="capLossInput" name="capital_loss" value="0" min="0" max="5000" step="1" required>
            </div>

            <!-- 5. Marital Status Dropdown -->
            <div class="mb-4">
                <label for="maritalInput" class="form-label">Marital Status</label>
                <!-- We use a select dropdown to avoid spelling mistakes from users -->
                <select class="form-select" id="maritalInput" name="marital_status" required>
                    <option value="Single" selected>Single / Divorced / Widowed</option>
                    <option value="Married">Married</option>
                </select>
            </div>

            <!-- Submit Button -->
            <!-- btn-primary gives the blue color, w-100 makes it full width -->
            <button type="submit" class="btn btn-primary w-100 fs-5">Predict Income</button>
            
        </form>

    </div>
</div>

</body>
</html>
