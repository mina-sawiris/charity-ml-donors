<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CharityML Prediction Results</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4" style="max-width: 800px; margin: auto;">

        <h2 class="text-center mb-4">Prediction Results</h2>

        <!-- Two predictions side by side -->
        <div class="row text-center mb-4">
            <div class="col-md-6">
                <h5>AdaBoost Prediction</h5>
                <div class="p-3 border rounded bg-white">
                    <h4 class="{{ 'text-success' if ada_pred == '>50K' else 'text-danger' }}">
                        {{ ada_pred }}
                    </h4>
                </div>
            </div>

            <div class="col-md-6">
                <h5>Gradient Boosting Prediction</h5>
                <div class="p-3 border rounded bg-white">
                    <h4 class="{{ 'text-success' if gb_pred == '>50K' else 'text-danger' }}">
                        {{ gb_pred }}
                    </h4>
                </div>
            </div>
        </div>

        <hr>

        <!-- Chart -->
        <h5 class="text-center mb-3">Applicant Position vs Training Data</h5>
        <canvas id="resultChart" height="120"></canvas>

        <script>
            const trainPoints = {{ train_points | safe }};
            const userX = {{ user_x }};
            const adaY = {{ ada_pred_numeric }};
            const gbY = {{ gb_pred_numeric }};

            const ctx = document.getElementById('resultChart').getContext('2d');

            new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [
                        {
                            label: 'Training Data',
                            data: trainPoints,
                            backgroundColor: 'rgba(0, 128, 0, 0.6)'  // green
                        },
                        {
                            label: 'AdaBoost Prediction',
                            data: [{x: userX, y: adaY}],
                            backgroundColor: 'rgba(255, 0, 0, 1)',  // red
                            pointRadius: 8
                        },
                        {
                            label: 'GradientBoost Prediction',
                            data: [{x: userX, y: gbY}],
                            backgroundColor: 'rgba(0, 0, 255, 1)',  // blue
                            pointRadius: 8
                        }
                    ]
                },
                options: {
                    scales: {
                        x: { title: { display: true, text: 'Feature (e.g., Age)' } },
                        y: { title: { display: true, text: 'Income (0 = ≤50K, 1 = >50K)' }, min: -0.2, max: 1.2 }
                    }
                }
            });
        </script>

        <hr>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-secondary w-50 fs-5">Enter New Data</a>
        </div>

    </div>
</div>

</body>
</html>
