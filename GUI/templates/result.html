<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CharityML Prediction Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4" style="max-width: 800px; margin: auto;">

        <h2 class="text-center mb-2">Prediction Results</h2>
        
        <h5 class="text-center text-muted mb-4">{{ label }}</h5>

        <div class="row text-center mb-4 justify-content-center">
            {% for r in results %}
            <div class="col-md-5 mx-2 mb-3">
                <h5>{{ r.model }}</h5>
                <div class="p-3 border rounded bg-white">
                    <h4 class="{{ 'text-success' if r.prediction == 1 else 'text-danger' }}">
                        {{ r.label }}
                    </h4>
                    <p class="mb-0 text-muted">Probability: {{ r.probability }}%</p>
                </div>
            </div>
            {% endfor %}
        </div>

        <hr>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-secondary w-50 fs-5">Enter New Data</a>
        </div>

    </div>
</div>

</body>
</html>
